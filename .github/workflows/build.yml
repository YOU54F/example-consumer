name: Build

on:
  push:
  workflow_dispatch:

env:
  PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
  PACT_PROVIDER: pactflow-example-provider
  PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
  REACT_APP_API_BASE_URL: http://localhost:3001
  GIT_COMMIT: ${{ github.sha }}
  GIT_REF: ${{ github.ref }}
  ENVIRONMENT: production
  PACTICIPANT: pactflow-example-consumer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install
        run: npm i
      - name: Test
        env:
          PACT_PROVIDER: ${{ env.PACT_PROVIDER }}
        run: make test
      - uses: you54f/pact-broker-cli@main
      - name: Publish pacts between pactflow-example-consumer and ${{ env.PACT_PROVIDER }}
        run: pact-broker-cli pact-broker publish --dir pacts --auto-detect-version-properties

  # Runs on branches as well, so we know the status of our PRs
  can-i-deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      # - run: docker pull pactfoundation/pact-cli:latest
      - uses: you54f/pact-broker-cli@main
      - name: Can I deploy?
        run: |
          pact-broker-cli pact-broker can-i-deploy \
            --pacticipant ${PACTICIPANT} \
            --version ${GIT_COMMIT} \
            --to-environment ${ENVIRONMENT} \
            --retry-while-unknown 30 \
            --retry-interval 10

  # Only deploy from master
  deploy:
    runs-on: ubuntu-latest
    needs: can-i-deploy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      # - run: docker pull pactfoundation/pact-cli:latest
      - uses: you54f/pact-broker-cli@main
      - name: Deploy
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/test'
        run: |
          pact-broker-cli pact-broker record-deployment \
            --pacticipant ${PACTICIPANT} \
            --version ${GIT_COMMIT} \
            --environment ${ENVIRONMENT}
